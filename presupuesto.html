<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solicita un presupuesto personalizado para tus tortas y eventos especiales.">
    <meta name="keywords" content="pastelería, tortas, pasteles, bocaditos, Barcelona, repostería personalizada">
    <title>Pasteleria Dulcinea | Tortas y pasteles personalizados en Barcelona</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>
<body> 
    <div class="container">
        <header class="logo-header">
            <a href="index.html">
                <img src="imag/logoD.jpeg" alt="logo" class="logoP">
            </a>
        </header>

        <nav>
            <div id="navMenu">
                <a href="index.html">Inicio</a>
                <a href="galeria.html">Galería</a>
                <a href="presupuesto.html">Presupuesto</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>

        <!-- FORMULARIO -->
        <section class="form-register">
            <h4>Solicite información</h4>
            <form action="#" method="post">
                <input class="controls" type="text" name="nombres" id="nombres" placeholder="Ingrese su Nombre" required>
                <input class="controls" type="tel" name="telefono" id="telefono" placeholder="Ingrese su Teléfono" required>
                <input class="controls" type="email" name="correo" id="correo" placeholder="Ingrese su Correo" required>
                <input class="controls" type="text" name="pedido" id="pedido" placeholder="Describa su Pedido" required>

                <div class="terminos">
                    <input type="checkbox" id="privacidad" required>
                    <label for="privacidad">He leído y acepto la <a href="#">Política de Privacidad</a></label>
                </div>

                <!-- Botón simulado (sin JS) que activa el modal mediante el href -->
                <div class="contenedor-boton">
                    <a href="#mensaje-enviado" class="boton-falso">Solicitar presupuesto</a>
                </div>
            </form>

            <!-- Modal (sin JavaScript) -->
            <div id="mensaje-enviado" class="modal" role="dialog" aria-labelledby="mensaje-titulo" aria-modal="true">
                <div class="modal-contenido">
                    <h2 id="mensaje-titulo">¡Gracias!</h2>
                    <p>Tu solicitud ha sido registrada.</p>
                    <a href="#" class="cerrar">Cerrar</a>
                </div>
            </div>
        </section>

        <!-- PIE DE PÁGINA -->
        <footer>
            <div class="footer-container">
                <div class="social">
                    <p><strong>Síguenos</strong></p>
                    <a href="https://www.facebook.com/DulceEncantoPasteleria" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/DulceEncantoPasteleria" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://twitter.com/DulceEncantoPast" target="_blank"><i class="fab fa-twitter"></i></a>
                </div>
                <div class="info">
                    <p><strong>Pastelería Dulcinea</strong></p>
                    <p><strong>Calle Sol y Padris 7 - Barcelona</strong></p>
                    <p><strong>&copy; 2025 | Todos los derechos reservados</strong></p>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
