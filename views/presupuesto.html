<body>
    <div class="container">

            <!-- LOGO con ruta corregida -->
            <a href="index.html" class="logo">

            <nav>
                <ul id="navMenu">
                    <li><a href="index.html">Inicio</a></li>

                    <li><a href="presupuesto.html" class="active">Presupuesto</a></li>
                </ul>
            </nav>
        </header>

        <h1 class="title" style="text-align:center; font-family:'Dancing Script',cursive;">
            Solicite su Presupuesto
        </h1>

        <section class="form-register">
            <h4>Solicite información</h4>

            <form action="#gracias" method="get">

                <input class="controls" type="text" name="nombres" id="nombres"
                    placeholder="Ingrese su Nombre"
                    pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,50}$"
                    title="Solo letras y espacios, mínimo 2 caracteres"
                    required>

                <input class="controls" type="tel" name="telefono" id="telefono"
                    placeholder="Ingrese su Teléfono"
                    pattern="^[6-9][0-9]{8}$"
                    title="Debe contener 9 cifras y empezar por 6, 7, 8 o 9"
                    required>

                <input class="controls" type="email" name="correo" id="correo"
                    placeholder="Ingrese su Correo"
                    required>

                <input class="controls" type="text" name="pedido" id="pedido"
                    placeholder="Describa su pedido"
                    pattern="^.{10,}$"
                    title="Debe describir el pedido con al menos 10 caracteres"
                    required>

                <div class="terminos">
                    <input type="checkbox" id="privacidad" required>
                    <label for="privacidad">
                        He leído y acepto la
                        <a href="#privacidad-info">Política de Privacidad</a>
                    </label>
                </div>

                <input class="botons" type="submit" value="Enviar solicitud">
            </form>
        </section>

        <!-- Mensaje éxito -->
        <p id="gracias">✅ ¡Su solicitud se ha enviado correctamente!</p>

            <div class="info" style="margin-top:10px;">
